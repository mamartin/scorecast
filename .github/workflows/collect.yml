# Každou noc doplní srovnání předpovědí s měřením za včerejšek a chybějící dny
# za posledních 35 dní (např. měsíční data ČHMÚ, která vycházejí se zpožděním)
# a uloží archiv do repozitáře. Commit spustí deploy na Vercelu, který z archivu
# připraví data pro API (scripts/build-data.mjs).
name: Noční ověření modelů

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC – měření za včerejšek je kompletní
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Kolik dní zpět doplnit (nejvýš 90 se použije na webu)"
        required: false
        default: "35"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Open-Meteo zdarma pustí 5 000 vážených dotazů za hodinu → běh trvá ~2 h.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sběr a výpočet
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '35' }}
          # Rozpočet vážených dotazů na Open-Meteo (zdarma 10 000 denně).
          OM_BUDGET: "9000"
        run: node scripts/collect.mjs
      - name: Uložit data
        run: |
          git add archive
          if git diff --cached --quiet; then
            echo "Beze změny."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data: ověření modelů $(date -u +%F)"
          # Mezitím mohl přibýt commit s kódem → nejdřív ho stáhnout.
          git pull --rebase
          git push
